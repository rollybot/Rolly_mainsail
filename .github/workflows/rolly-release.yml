name: Rolly Release
on:
  push:
    tags: ['v*-rolly*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vite build

      - name: Package
        run: |
          cd dist
          zip -r ../mainsail.zip . -x '**.DS_Store'

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: mainsail.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true